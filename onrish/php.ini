register_globals = Off;
enable_safe_mode = on;
display_errors = Off
max_execution_time = 120
max_input_time = 60
max_input_vars = 1000
memory_limit = 128M
post_max_size = 8M
session.gc_maxlifetime = 151440
session.save_path = "/var/webuzo-data/php/sessions/php81"
upload_max_filesize = 16M
zlib.output_compression = Off
date.timezone = 'Asia/Calcutta'
Default.timezone='Asia/Calcutta';
allow_url_fopen = 1 //0 for Off and 1 for On Flag
allow_url_include = 1 //0 for Off and 1 for On Flag
